<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust Server Test Suite</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        .section { background: #f4f4f4; padding: 15px; margin-bottom: 20px; border-radius: 5px; }
        button { padding: 8px 15px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Rust HTTP Server Test Bench 🚀</h1>
    <p>Use the controls below to test your server features directly from the browser.</p>

    <!-- 1. Static File & GET Test -->
    <div class="section">
        <h3>1. Static File Serving (GET)</h3>
        <p>Test fetching a static resource.</p>
        <a href="/index.html" target="_blank"><button>Open index.html</button></a>
    </div>

    <!-- 2. CGI POST Test -->
    <div class="section">
        <h3>2. CGI Execution (POST)</h3>
        <form action="/cgi-bin/post_test.py" method="POST">
            <input type="text" name="name" value="BrowserUser">
            <button type="submit">Send POST to CGI</button>
        </form>
    </div>

    <!-- 3. Error Page Tests (404 / 405) -->
    <div class="section">
        <h3>3. Error Handling Tests</h3>
        <p>Test triggering custom HTML error pages.</p>
        <a href="/non_existent_page.html" target="_blank"><button>Test 404 Not Found</button></a>
        <button onclick="test405MethodNotAllowed()">Test 405 Method Not Allowed</button>
    </div>

    <script>
        function test405MethodNotAllowed() {
            fetch("/index.html", { method: "POST" })
              .then(res => res.text())
              .then(html => {
                  document.open();
                  document.write(html);
                  document.close();
              });
        }
    </script>
</body>
</html>
